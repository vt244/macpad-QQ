name: Bug report
description: Report a problem in macpad++
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a small example file if it helps reproduce the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macpad++ version, OS version, and architecture
      placeholder: macpad++ 0.2.0, macOS 15, Apple silicon
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Additional context
      description: Mention plugins, themes, or translations involved and whether the issue occurs with the default profile.
