name: Feature request
description: Suggest an improvement to macpadqq
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Describe the task and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how macpadqq could support the task.
    validations:
      required: true
